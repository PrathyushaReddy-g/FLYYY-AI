version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flyyy_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flyyy_cdp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: flyyy_mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyyy_backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DATABASE_URL_SOURCE: postgresql://postgres:postgrespassword@postgres:5432/flyyy_cdp
      DATABASE_URL_PROTECTED: postgresql://postgres:postgrespassword@postgres:5432/flyyy_cdp
      DATABASE_URL_VAULT: postgresql://postgres:postgrespassword@postgres:5432/flyyy_cdp
      DATABASE_URL_POLICY: postgresql://postgres:postgrespassword@postgres:5432/flyyy_cdp
      DATABASE_URL_AUDIT: postgresql://postgres:postgrespassword@postgres:5432/flyyy_cdp
      FPE_KEY_HEX: ${FPE_KEY_HEX:-4f8a12bc90e345f187a2c6d9e01347894f8a12bc90e345f187a2c6d9e0134789}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:-9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e}
      TOKEN_KEY_HEX: ${TOKEN_KEY_HEX:-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
      JWT_SECRET: ${JWT_SECRET:-8f7e6d5c4b3a210987654321fedcba988f7e6d5c4b3a210987654321fedcba98}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flyyy_frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
